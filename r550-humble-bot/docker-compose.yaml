version: '3.8'

services:
  # =========================================================================
  # Service 1: R550 Chassis STM32 Motor Controller & IMU
  # =========================================================================
  r550_chassis:
    image: registry.cn-chengdu.aliyuncs.com/zpdemo/r550-humble-bot:latest
    container_name: r550_chassis
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    environment:
      - ROS_DOMAIN_ID=55 # 🌟 统一对齐 Domain 55 频道，防止局域网内其他零碎节点串频
      # - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp # 🌟 临时关闭以使用镜像内置的默认 FastDDS
    volumes:
      - /dev:/dev
    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/install/setup.bash &&
      echo '🏎️  Starting Wheeltec STM32 Chassis Driver Node...' &&
      ros2 launch turn_on_wheeltec_robot turn_on_wheeltec_robot.launch.py
      "

  # =========================================================================
  # Service 2: Lslidar N10 Laser Scanner
  # =========================================================================
  r550_lidar:
    image: registry.cn-chengdu.aliyuncs.com/zpdemo/r550-humble-bot:latest
    container_name: r550_lidar
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    environment:
      - ROS_DOMAIN_ID=55
      # - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp # 🌟 避坑修复：必须同步关闭，否则雷达容器会因找不到 .so 动态库闪退！
    volumes:
      # Mount custom N10 configuration and launch overrides to bypass RViz2 dependency
      - ./config/lslidar_x10.yaml:/workspace/install/share/lslidar_driver/config/lslidar_x10.yaml:ro
      - ./config/lslidar_x10_launch.py:/workspace/install/share/lslidar_driver/launch/lslidar_x10_launch.py:ro
      - /dev:/dev
    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/install/setup.bash &&
      echo '📡 Starting Lslidar N10 Driver Node...' &&
      ros2 launch lslidar_driver lslidar_x10_launch.py
      "

  # =========================================================================
  # Service 3: Orbbec Astra Depth Camera
  # =========================================================================
  r550_camera:
    image: registry.cn-chengdu.aliyuncs.com/zpdemo/r550-humble-bot:latest
    container_name: r550_camera
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    environment:
      - ROS_DOMAIN_ID=55
      # - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp # 🌟 避坑修复：必须同步关闭，否则相机容器会因找不到 .so 动态库闪退！
    volumes:
      - /dev:/dev
    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/install/setup.bash &&
      echo '📸 Starting Orbbec Astra Depth Camera Node...' &&
      ros2 launch orbbec_camera astra.launch.py
      "
