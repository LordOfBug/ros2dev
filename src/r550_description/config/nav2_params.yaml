# R550 机器人 Nav2 Humble 核心导航参数配置文件
# 采用无图导航模式 (Mapless Navigation) —— 将 odom 设为全局坐标系
# 注意：无图模式不需要 AMCL 和 Map Server

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: odom          # 【核心修改】：将全局参考系从 map 改为 odom
    robot_base_frame: base_footprint
    odom_topic: odom
    enable_groot_monitoring: True
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 进度检查器：确保小车没有卡住
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # 目标检查器：判断小车是否到达终点
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15      # 距离终点 15 厘米内算到达
      yaw_goal_tolerance: 0.25     # 角度偏差在 0.25 弧度内算对齐

    # 局部控制器 (DWB 算法) —— 负责具体控制轮子避障旋转
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      max_vel_x: 0.4               # R550 安全最大线速度 (0.4 m/s)
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.0           # 最大转弯角速度 (1.0 rad/s)
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.1
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridTransition"]
    GridTransition:
      plugin: "nav2_navfn_planner/NavFnPlanner" # 经典的 A* / Dijkstra 全局路径规划器
      use_astar: True
      allow_unknown: True

# 恢复行为服务器：控制 spin / backup / wait 等自救动作
behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# 全局代价地图：用于全局路径规划（无图模式使用滚动窗口）
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom        # 【核心修改】：无图导航模式下设为 odom
      robot_base_frame: base_footprint
      use_sim_time: True
      robot_radius: 0.18        # 小车的物理安全碰撞半径 (18 厘米)
      resolution: 0.05
      rolling_window: True      # 【无图模式必须】：滚动窗口随车移动
      width: 20.0               # 20m x 20m 全局感知范围
      height: 20.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35  # 【安全缓冲区】：墙壁和障碍物周围 35 厘米内不允许小车靠近

# 局部代价地图：小车身边的实时避障雷达网格
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: True      # 滚动窗口：地图随着小车移动而移动
      width: 3.0                # 局部感知范围：3米 x 3米
      height: 3.0
      resolution: 0.05
      robot_radius: 0.18
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
